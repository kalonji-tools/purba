# Every command purba runs. `mise.toml` names which versions of a tool purba
# accepts; this file names which commands purba runs with them.
# https://mise.jdx.dev/tasks/

[build]
description = "Build the wheel"
run = "maturin build"

[clean]
description = "Remove the build output"
run = "cargo clean"

[fmt]
description = "Rewrite the formatting"
depends = ["fmt:shell"]
run = "cargo fmt"

["fmt:shell"]
description = "Rewrite the shell formatting"
shell = "bash -c"
run = "shfmt --write $(git ls-files '*.sh' '*.bats')"

["fmt:check"]
description = "Refuse unformatted code"
shell = "bash -c"
run = ["cargo fmt --check", "shfmt --diff $(git ls-files '*.sh' '*.bats')"]

["lint:shell"]
description = "Refuse a shell defect"
shell = "bash -c"
run = "shellcheck -x $(git ls-files '*.sh' '*.bats')"

["lint:style"]
description = "Refuse a line that breaks the style every editor reads"
run = "ec"

["lint:placement"]
description = "Refuse a script that sits in the wrong directory"
shell = "bash -c"
run = "scripts/check-placement.sh"

["lint:manifests"]
description = "Refuse a package that two manifests declare, and any in pyproject.toml"
shell = "bash -c"
run = "scripts/check-manifests.sh"

["lint:readers"]
description = "Refuse a tracked file that reaches no actor, and a name off the roster"
shell = "bash -c"
run = "scripts/check-readers.sh"

["lint:licences"]
description = "Refuse a dependency whose licence is not on the allowlist"
run = "cargo-deny check licenses"

["lint:links"]
description = "Refuse a dead link, and a path a comment cites that git does not track"
shell = "bash -c"
run = "scripts/check-links.sh"

[clippy]
description = "Refuse a lint"
run = "cargo clippy --all-targets"

[doc]
description = "Refuse a broken link in the Rust documentation"
run = "cargo doc --no-deps"

["test:rust"]
description = "Run the Rust tests"
# A plain `cargo test` leaves `extension-module` off, so PyO3 links libpython
# and the test binary must find it again at run time. macOS does not search the
# interpreter's own library directory, and the binary aborts as it loads.
# https://pyo3.rs/v0.29.2/building-and-distribution#dynamically-embedding-the-python-interpreter
#
# The assignment is rendered on macOS alone. Windows runs a task through `cmd`,
# which reads neither this syntax nor the variable.
# https://mise.jdx.dev/tasks/task-configuration.html
run = """
{% if os() == "macos" %}export DYLD_FALLBACK_LIBRARY_PATH=$(python -c \
'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')
{% endif %}cargo test
"""

["test:doc"]
description = "Run the examples in the Rust documentation"
run = "cargo test --doc"

["test:scripts"]
description = "Run purba's own scripts against the shapes they refuse"
#   the decision:  docs/decisions/purba-writes-its-scripts-in-bash-until-purba-can-test-them.md
#
# bats names the line that failed and never what the script wrote, so the flag
# prints the script's output beside it.
run = "bats --print-output-on-failure --recursive scripts/test"

[records]
description = "Refuse a decision record that breaks a rule a command can decide"
shell = "bash -c"
run = "scripts/check-records.sh"

[quality]
description = "Every lint, format and record gate, in one command"
depends = [
  "fmt:check",
  "lint:shell",
  "lint:style",
  "lint:placement",
  "lint:manifests",
  "lint:readers",
  "lint:licences",
  "lint:links",
  "records",
  "clippy",
  "doc",
  "test:doc",
]

[check]
description = "Every gate, in one command"
depends = ["quality", "test:rust", "test:scripts"]

[preflight]
description = "Every gate, from a clean tree"
depends = ["clean"]
depends_post = ["check", "build"]

["sign-off"]
description = "Sign every commit on your branch. A person runs this, never an agent"
# Hidden because that listing is what an agent reads to find what it may run.
hide = true
# cmd cannot exec a shebang.
shell = "bash -c"
run = "scripts/sign-branch.sh"

["apply-fork"]
description = "Carry a contribution from a fork into this repository"
hide = true
shell = "bash -c"
run = "scripts/apply-fork-contribution.sh"
