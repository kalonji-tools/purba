[package]
name = "purba"
# git-cliff computes the version and .github/scripts/release.sh writes it here,
# so it is never chosen by hand. `0.0.0` means nothing is released yet.
version = "0.0.0"
description = "A Python test framework written in Rust"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "purba"
#   the decision:  docs/decisions/the-crate-carries-an-rlib.md
crate-type = ["cdylib", "rlib"]

[dependencies]
purba-command = { path = "../command" }
pyo3 = { workspace = true, features = ["abi3-py312"] }

[features]
#   the decision:  docs/decisions/the-crate-carries-an-rlib.md
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true
