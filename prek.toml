# Every gate that refuses a commit on this machine.
# https://prek.j178.dev
#:schema https://www.schemastore.org/prek.json

# Without this, `prek install` writes the pre-commit shim alone and every
# commit-msg hook below silently never fires.
default_install_hook_types = ["pre-commit", "commit-msg", "pre-merge-commit"]

# A hook that declares no stage runs at every stage, so each one names its own.
#
# check-merge-conflict does nothing outside a merge without its flag.
#
# no-commit-to-branch names a second stage because a merge runs no pre-commit
# hook. No hook of any kind runs on a cherry-pick.
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", stages = ["pre-commit"] },
  { id = "end-of-file-fixer", stages = ["pre-commit"] },
  { id = "check-toml", stages = ["pre-commit"] },
  { id = "check-yaml", stages = ["pre-commit"] },
  { id = "check-merge-conflict", args = ["--assume-in-merge"], stages = ["pre-commit"] },
  { id = "check-added-large-files", stages = ["pre-commit"] },
  { id = "detect-private-key", stages = ["pre-commit"] },
  { id = "check-vcs-permalinks", stages = ["pre-commit"] },
  { id = "check-case-conflict", stages = ["pre-commit"] },
  { id = "check-illegal-windows-names", stages = ["pre-commit"] },
  { id = "check-executables-have-shebangs", stages = ["pre-commit"] },
  { id = "check-shebang-scripts-are-executable", stages = ["pre-commit"] },
]

# A block table, because the inline form cannot hold the newline this row needs
# to fit a hundred columns.
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "no-commit-to-branch"
args = ["-b", "main"]
stages = ["pre-commit", "pre-merge-commit"]

# The three hooks below carry the decidable subject rules from
# `docs/decisions/a-commit-outlives-its-review.md`.
#
# git's own `Revert "..."` and `Merge ...` subjects are refused: `revert` is
# a conventional type, and this branch history is rebase-only.
#
# A second `builtin` block, because one repo takes `hooks = [...]` or
# `[[repos.hooks]]` and never both.
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "require-pattern"
alias = "subject-form"
name = "subject form"
stages = ["commit-msg"]
args = [
  "-m",
  """\
\\A(?:(?:fixup|squash|amend)! )*\
(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)\
(\\([a-z0-9._-]+\\))?!?: [a-z][^\\n]*\\(#\\d+\\)$""",
]

[[repos.hooks]]
id = "require-pattern"
alias = "subject-length"
name = "subject at most 72 characters"
stages = ["commit-msg"]
args = ["-m", "\\A(?:(?:fixup|squash|amend)! )*[^\\n]{0,72}$"]

[[repos.hooks]]
id = "deny-pattern"
alias = "subject-full-stop"
name = "no full stop before the reference"
stages = ["commit-msg"]
args = ["-m", "\\A[^\\n]*[.!?]\\s*\\(#\\d+\\)\\s*$"]

# Every entry reaches its tool through mise, and none may call it directly. On
# PATH alone a hook finds no tool, and prek exits 2 without running it.
# https://github.com/jdx/mise/discussions/6830
[[repos]]
repo = "local"

# `CHANGELOG.md` is generated, and only its generator writes to it.
#
#   the decision:  docs/decisions/a-gate-owns-the-mechanical.md
[[repos.hooks]]
id = "typos"
name = "typos --write-changes"
language = "system"
entry = "mise x -- typos --write-changes"
exclude = '^CHANGELOG\.md$'
stages = ["pre-commit"]

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "mise x -- cargo fmt"
stages = ["pre-commit"]
pass_filenames = false
files = "\\.rs$"

# `cargo fmt` formats the crate and never a cargo script.
[[repos.hooks]]
id = "rustfmt-cargo-scripts"
name = "rustfmt, each cargo script"
language = "system"
entry = "mise run fmt:cargo-scripts"
stages = ["pre-commit"]
pass_filenames = false
files = '^(scripts|\.github)/.*\.rs$'

[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
language = "system"
entry = "mise run lint:shell"
stages = ["pre-commit"]
pass_filenames = false

[[repos.hooks]]
id = "shfmt"
name = "shfmt --write"
language = "system"
entry = "mise run fmt:shell"
stages = ["pre-commit"]
pass_filenames = false

# Invoked as `ec`: the roster name is `editorconfig-checker`, but the package
# ships the binary under the short name.
[[repos.hooks]]
id = "editorconfig-checker"
name = "editorconfig-checker"
language = "system"
entry = "mise run lint:style"
stages = ["pre-commit"]
pass_filenames = false
