[build-system]
#   the decision:  docs/decisions/one-manifest-declares-each-package.md
requires = []
build-backend = "maturin"

[project]
name = "purba"
# maturin reads the version and the repository from Cargo.toml.
dynamic = ["version", "urls"]
requires-python = ">=3.12"
description = "A Python test framework written in Rust"
readme = "README.md"
# PEP 639 form: an SPDX expression, not the deprecated `{ text = "MIT" }` table
# that PEP 639 replaced. MIT rather than dual MIT/Apache-2.0 because purba's
# only published artifact is a wheel — `publish = false` means the crate serves
# no `cargo add` consumer, which is who the Rust dual convention is for.
license = "MIT"
license-files = ["LICENSE"]

# Classifiers are deliberately absent.
#
# No `License ::` entry: PEP 639 deprecated licence classifiers in favour of the
# `license` expression above, and carrying both invites them to disagree.
#
# No `Operating System ::` entries either. Each wheel's platform tag already
# states where it installs, and nothing would compare a second list with it.
# https://packaging.python.org/en/latest/specifications/platform-compatibility-tags/
#
# No `Programming Language :: Python :: 3.x` entries, ever. They would be a
# second version-shaped set that nothing compares against `requires-python`.

[tool.maturin]
module-name = "purba"
# purba's own feature, not `pyo3/extension-module` directly. Naming the local
# feature keeps the indirection in one place.
features = ["extension-module"]

# What typos rewrites beyond its own dictionary.
#
#   the decision:  docs/decisions/the-glossary-stays-open-and-a-gate-rewrites-each-word-it-avoids.md
#
# typos reads this table after typos.toml, _typos.toml, .typos.toml and Cargo.toml.
# https://github.com/crate-ci/typos/blob/v1.50.2/docs/reference.md

[tool.typos.default]
# A word the glossary avoids is still named where it is avoided: in its
# `_Avoid_` line, and in a code span that quotes it. Each word below joins the
# first pattern.
extend-ignore-re = ["`tickets?`", "_Avoid_: [^\\n]*"]

[tool.typos.default.extend-words]
ticket = "issue"
tickets = "issues"

# What lychee checks beyond its defaults, and what it skips.
#
#   the decision:  docs/decisions/a-gate-owns-the-mechanical.md
#   the command:   scripts/check-links.sh
#
# lychee reads this table from the directory it runs in, after lychee.toml and Cargo.toml.
# https://github.com/lycheeverse/lychee/blob/lychee-v0.24.2/lychee-bin/src/config/loaders/mod.rs#L34
#
# Each setting below is one lychee.example.toml names.
# https://github.com/lycheeverse/lychee/blob/lychee-v0.24.2/lychee.example.toml

# Every optional check is on except those named below, because a tool that
# detects runs at the strictest setting it offers.
[tool.lychee]
include_fragments = "full"
include_verbatim = true
require_https = true

# A redirect is refused, so a link moves to the address it now names.
max_redirects = 0

# These optional checks stay off, at their defaults.
#
# Mail is not checked. Every address in this tree is a git identity, and none
# has a mailbox to find.
#
# Wikilinks are not read, because purba writes none.

exclude = [
  # A script builds this address from a variable, so it is never visited as
  # written.
  '%7B',
  # A test writes these into a fixture, and no repository holds them. Written
  # with no scheme, because lychee reads this file too.
  '//github\.com/(o|owner)/',
]
