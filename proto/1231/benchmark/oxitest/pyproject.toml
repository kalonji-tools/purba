[tool.oxitest]
testpaths = ["tests"]
# Refuse to run at all if a test breaks oxitest's authoring rules:
# every assert carries a message, parametrize cases are frozen dataclasses,
# fixtures are annotated, no single-case parametrize, no stray helpers.
strict = "abort"

# dateutil registers the mark smoke; oxitest refuses a mark it does not know.
markers = ["smoke: a quick check of an internal"]
