# Project-level worktrunk overrides. Hook names, hook semantics and
# `wt hook show`: https://worktrunk.dev/worktrunk/
# Bare keys must stay above the first table: https://toml.io/en/v1.0.0#table

# purba's environment is devenv, reached through .envrc. The user-level
# post-switch hook enters it for the switching command; this refreshes direnv's
# cached export so an interactive shell in the worktree sees the same one.
post-switch = "direnv reload"

[pre-start]

# Trust this worktree's .envrc at creation, so entering it activates devenv
# without a prompt.
direnv = "command -v direnv >/dev/null && direnv allow || true"

# purba's branch names carry their issue numbers, so a branch name alone says
# what is being worked. Every number is extracted rather than the first,
# because a branch may name two. Only branch names are matched, an open pull
# request's included, and never a pull request body: a body also cites the
# tickets it defers to, and a deferral is not a collision. Neither call is
# silenced, because an unreachable GitHub must not read as no collisions.
# Advisory regardless: it always exits 0, and it sees nothing that happened
# before a worktree existed.
concurrency = """
issues=$(printf '%s' '{{ branch }}' | grep -oE '[0-9]{2,}' | sort -u); \
[ -z "$issues" ] && exit 0; \
others=$(git branch -r --format='%(refname:short)' | sed 's|^origin/||' | grep -vxF '{{ branch }}'); \
prs=$(gh pr list --state open --json number,headRefName --jq '.[] | "\\(.number)\\t\\(.headRefName)"'); \
for n in $issues; do \
  b=$(printf '%s\\n' "$others" | grep -E "(^|[^0-9])$n([^0-9]|$)" || true); \
  p=$(printf '%s\\n' "$prs" | awk -F'\\t' -v n="$n" -v cur='{{ branch }}' '$2 != cur && $2 ~ "(^|[^0-9])" n "([^0-9]|$)" { print $1, $2 }'); \
  if [ -n "$b" ] || [ -n "$p" ]; then \
    printf '  concurrent work on #%s:\\n' "$n"; \
    [ -n "$b" ] && printf '    branch %s\\n' $b; \
    [ -n "$p" ] && printf '    PR #%s (%s)\\n' $p; \
    printf '    another session may be on this — check before starting.\\n'; \
  fi; \
done; \
exit 0
"""
