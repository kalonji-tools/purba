# Project-level overrides, composed with ~/.config/worktrunk/config.toml rather
# than replacing it. Hook names are versioned, and a wrong one is ignored or
# silently aliased rather than reported, so `wt hook show` is the only reliable
# statement of what each command runs: https://worktrunk.dev/worktrunk/
#
# Bare keys must stay above the [pre-start] table, because a table consumes
# every key that follows it: https://toml.io/en/v1.0.0#table

# The user-level post-switch hook enters devenv for the switching command; this
# refreshes direnv's cached export so an interactive shell in the new worktree
# sees the same environment.
post-switch = "direnv reload"

[pre-start]

# Approve this worktree's .envrc so entering it activates devenv without a
# prompt. pre-start rather than post-switch: it fires once at creation and
# blocks, so the environment is trusted before anything tries to use it.
# Guarded, and `|| true`, because a non-zero exit from a blocking hook aborts
# worktree creation on any machine that has no direnv.
#
# It does not replace a direnv `whitelist` prefix, which also covers
# directories created outside wt and survives the .envrc edits that re-trigger
# the approval prompt. This hook is the portable half: it travels with the repo.
direnv = "command -v direnv >/dev/null && direnv allow || true"

# Warn when another branch or open pull request already touches this branch's
# issue numbers. Advisory only: it always exits 0, because a false positive
# from a blocking hook must never abort worktree creation.
#
# Every number in the branch name is extracted rather than the first, so a
# branch naming two issues checks both. It covers implementation and merge
# collisions, and cannot see one that happens before any worktree exists.
#
# Test without creating a worktree: `wt hook pre-start concurrency`.
concurrency = """
issues=$(printf '%s' '{{ branch }}' | grep -oE '[0-9]{2,}' | sort -u); \
[ -z "$issues" ] && exit 0; \
others=$(git branch -r --format='%(refname:short)' 2>/dev/null | sed 's|^origin/||' | grep -vxF '{{ branch }}'); \
prs=$(gh pr list --state open --json number,headRefName,body --jq '.[] | "\\(.number)\\t\\(.headRefName)\\t\\(.body|gsub("\\n";" "))"' 2>/dev/null); \
for n in $issues; do \
  b=$(printf '%s\\n' "$others" | grep -E "(^|[^0-9])$n([^0-9]|$)" || true); \
  p=$(printf '%s\\n' "$prs" | grep -vE "^[0-9]+\\s+{{ branch }}\\s" | grep -E "#$n([^0-9]|$)" | cut -f1,2 || true); \
  if [ -n "$b" ] || [ -n "$p" ]; then \
    printf '  concurrent work on #%s:\\n' "$n"; \
    [ -n "$b" ] && printf '    branch %s\\n' $b; \
    [ -n "$p" ] && printf '    PR #%s (%s)\\n' $p; \
    printf '    another session may be on this — check before starting.\\n'; \
  fi; \
done; \
exit 0
"""
