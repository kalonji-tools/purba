# Project-level worktrunk overrides. These compose with the user-level config
# at ~/.config/worktrunk/config.toml rather than replacing it — `wt hook show`
# lists both, and it is the only reliable check of what each command actually
# runs.
#
# Bare keys MUST stay above the [pre-start] table. A TOML table consumes every
# key that follows it, so moving `post-switch` below the header makes it a
# member of [pre-start] instead. That has already cost one silently disabled
# hook, in the file this was copied from.
#
# Hook names are versioned, and a wrong one fails silently in both directions.
# On wt 0.29.0 `pre-start` was an unknown field and was ignored outright. Since
# 0.53.0 `post-create` is a *silent alias* for `post-start` — no warning, no
# deprecation, and `wt config update` does not migrate it — so a hook written
# as `post-create` quietly stops blocking and starts running in the background.
# Both cost the prototype a defect (oxitest#1885, oxitest#1891). Read
# `wt hook show` after any wt upgrade.

# Refresh direnv's cached export in the new worktree. The user-level
# post-switch hook enters devenv for the switching command; this is what makes
# an interactive shell in that directory see the same environment.
post-switch = "direnv reload"

# There is deliberately no `pre-merge` gate yet. It is `just preflight`, and
# both the recipe and the checks it runs are Write the justfile (#40) — a
# blocking hook calling a recipe that does not exist aborts every merge.

[pre-start]

# Approve this worktree's .envrc so entering it activates devenv without a
# prompt. pre-start, not post-switch: it fires once at creation and blocks, so
# the environment is trusted before post-switch or --execute try to use it.
#
# Guarded on direnv being present, and `|| true` on the end: pre-start is a
# blocking hook, so a non-zero exit aborts worktree creation. Without the guard
# every `wt switch --create` would fail on any machine that has no direnv.
#
# This does not replace a direnv `whitelist` prefix in
# ~/.config/direnv/direnv.toml — that also covers directories created outside
# wt, and survives .envrc edits, which re-trigger the approval prompt that this
# hook only clears at creation. The hook is the portable half: it travels with
# the repo to machines whose direnv config has never heard of this checkout.
direnv = "command -v direnv >/dev/null && direnv allow || true"

# Warn when another branch or open PR already touches this branch's issue
# numbers. Advisory only — it always exits 0, because pre-start is a blocking
# hook and a false positive must never abort worktree creation.
#
# Every issue number is extracted, not the first: a multi-issue branch like
# fix-39-40-substrate must check both. Taking only the first is a real defect
# shape, not a hypothetical one — it is how the prototype's version of this
# check went quiet.
#
# Covers implementation and merge collisions. It cannot see collisions at the
# issue stage, which happen before any worktree exists.
#
# Test without creating a worktree: `wt hook pre-start concurrency`.
concurrency = """
issues=$(printf '%s' '{{ branch }}' | grep -oE '[0-9]{2,}' | sort -u); \
[ -z "$issues" ] && exit 0; \
others=$(git branch -r --format='%(refname:short)' 2>/dev/null | sed 's|^origin/||' | grep -vxF '{{ branch }}'); \
prs=$(gh pr list --state open --json number,headRefName,body --jq '.[] | "\\(.number)\\t\\(.headRefName)\\t\\(.body|gsub("\\n";" "))"' 2>/dev/null); \
for n in $issues; do \
  b=$(printf '%s\\n' "$others" | grep -E "(^|[^0-9])$n([^0-9]|$)" || true); \
  p=$(printf '%s\\n' "$prs" | grep -vE "^[0-9]+\\s+{{ branch }}\\s" | grep -E "#$n([^0-9]|$)" | cut -f1,2 || true); \
  if [ -n "$b" ] || [ -n "$p" ]; then \
    printf '  concurrent work on #%s:\\n' "$n"; \
    [ -n "$b" ] && printf '    branch %s\\n' $b; \
    [ -n "$p" ] && printf '    PR #%s (%s)\\n' $p; \
    printf '    another session may be on this — check before starting.\\n'; \
  fi; \
done; \
exit 0
"""
