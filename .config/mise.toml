# purba needs a C compiler on the host and mise does not supply one. The build
# fails at the first dependency that compiles C.
#
# https://mise.jdx.dev/configuration

# The floor is the version that regenerates `.config/mise.lock` unchanged.
min_version = "2026.8.6"

[tools]
#   the decisions: docs/decisions/purba-meets-the-next-trait-solver-before-it-stabilizes.md
#                  docs/decisions/the-nightly-is-named-by-a-date.md
# https://mise.jdx.dev/lang/rust
rust = { version = "nightly-2026-11-09", components = "clippy,rustfmt,rust-analyzer,rust-src" }

# The floor `pyproject.toml` and `crates/purba/Cargo.toml` already name.
# https://mise.jdx.dev/lang/python
python = "3.12"

# 1.9.3 is the floor. PEP 639 support shipped in 1.9.0 and was fixed twice
# after: 1.9.2 writes `License-Expression` over `License`, and 1.9.3 adds
# `project.license-files` to a source distribution. mise reads no version range
# for maturin, so the request names a minor from 1.10 on, and never `1` or `1.9`.
# https://www.maturin.rs/changelog.html
maturin = "1.15"

prek = "0.5"

# codespell is not an alternative here: it does not honour `.gitignore`, so it
# reads `target/`.
typos = "1"

#   the decision:  docs/decisions/a-gate-owns-the-mechanical.md
#
# A major-version pin on purpose: a bump that adds an optional check is meant to
# turn the tree red rather than pass silently.
# https://www.shellcheck.net
shellcheck = "0"

# https://github.com/mvdan/sh
shfmt = "3"

# https://github.com/suzuki-shunsuke/pinact
pinact = "5"

# https://github.com/editorconfig-checker/editorconfig-checker
editorconfig-checker = "3"

#   the decision:  docs/decisions/purba-writes-its-scripts-in-bash-until-purba-can-test-them.md
# https://bats-core.readthedocs.io/en/stable/
bats = "1"

# https://jqlang.org
jq = "1"

# `lint:macos-jobs` reads a workflow as JSON through it.
# https://mikefarah.gitbook.io/yq
yq = "4"

#   the decision:  docs/decisions/purba-runs-on-linux-and-macos.md
#
# mise's own registry has neither tool, so both come from conda-forge.
# https://github.com/conda-forge/bash-feedstock
"conda:bash" = "5"
# https://github.com/conda-forge/sed-feedstock
"conda:sed" = "4"

# `bats --jobs` needs GNU parallel, and mise's own registry has none.
# https://github.com/conda-forge/parallel-feedstock
"conda:parallel" = "20260922"

# https://embarkstudios.github.io/cargo-deny/
"aqua:EmbarkStudios/cargo-deny" = "0"

#   the decision:  docs/decisions/an-unpublished-comment-carries-what-no-other-location-carries.md
# https://lychee.cli.rs
lychee = "0.24"

#   the register:  .config/cliff.toml
# https://git-cliff.org
git-cliff = "2"

[settings]
# This must be what creates `.config/mise.lock`: a file made with `touch` reads
# as an older format and loses its version header and every `specifiers` row.
# https://mise.jdx.dev/dev-tools/mise-lock
lockfile = true

# `mise lock` adds or changes a tool, because this refuses to bootstrap from
# `mise install`. Export GITHUB_TOKEN for that run or mise skips what it cannot
# fetch and still reports success.
# https://mise.jdx.dev/configuration/settings.html
locked = true

# A lockfile that mise makes from nothing otherwise targets Windows too. mise
# cannot solve conda's bash for Windows.
# https://mise.jdx.dev/configuration/settings.html
lockfile_platforms = [
  "linux-arm64",
  "linux-arm64-musl",
  "linux-x64",
  "linux-x64-musl",
  "macos-arm64",
  "macos-x64",
]

[settings.python]
# Otherwise a machine with no precompiled build compiles CPython, and the
# compiled entry splits the lockfile by the platform that produced it.
compile = false

# https://mise.jdx.dev/environments/
[env]
# pyo3's build script takes `CONDA_PREFIX` as the active environment, ahead of
# `PATH`, and the prefix of conda's bash holds no Python. `PYO3_PYTHON` comes
# before both.
# https://pyo3.rs/v0.29.2/building-and-distribution.html#configuring-the-python-version
PYO3_PYTHON = "python3"

# https://mise.jdx.dev/configuration/vars.html
[vars]
cargo_scripts = "'scripts/*.rs' '.github/*.rs'"
shell_files = "'*.sh' '*.bats'"

[task_config]
includes = [".config/tasks.toml"]
# A task body is bash, and stops at its first failed line.
# https://mise.jdx.dev/tasks/task-configuration.html
shell = "bash -c -o errexit"
