# Every task purba runs. `.config/mise.toml` names which versions of a tool purba
# accepts; this file names which tasks purba runs with them. The shell every task
# runs through, and each `{{vars.x}}` below, are set in `.config/mise.toml`.
# https://mise.jdx.dev/tasks/

["apply-fork"]
description = "Carry a contribution from a fork into this repository"
hide = true
run = "scripts/apply-fork-contribution.sh"

[build]
description = "Build the wheel"
run = "maturin build"

[check]
description = "Every lint and every test, in one command"
depends = ["lint", "test"]

[fmt]
description = "Rewrite every formatting difference, in one command"
depends = ["fmt:*"]

["fmt:cargo-scripts"]
description = "Rewrite the formatting of each cargo script"
run = "git ls-files -z {{vars.cargo_scripts}} | xargs -0 -r rustfmt --edition 2024"

["fmt:rust"]
description = "Rewrite the Rust formatting"
run = "cargo fmt"

["fmt:shell"]
description = "Rewrite the shell formatting"
run = "shfmt --write $(git ls-files {{vars.shell_files}})"

[lint]
description = "Every lint, in one command"
depends = ["lint:*"]

#   the decision:  docs/decisions/a-script-that-needs-a-rust-library-is-a-cargo-script.md
["lint:cargo-scripts"]
description = "Refuse an unformatted cargo script, or one that breaks a lint"
run = [
  "git ls-files -z {{vars.cargo_scripts}} | xargs -0 -r rustfmt --edition 2024 --check",
  '''
git ls-files {{vars.cargo_scripts}} | while read -r s; do
  cargo clippy -Zscript --release --locked --manifest-path "$s" --target-dir target/scripts \
    --config "resolver.lockfile-path=\"$PWD/${s%/*}/Cargo.lock\"" || exit 1
done
''',
]

["lint:licences"]
description = "Refuse a dependency whose licence is not on the allowlist"
run = "cargo-deny check licenses"

["lint:links"]
description = "Refuse a dead link, an untracked path a comment cites, and a `mise run` of no task"
run = "scripts/check-links.sh"

["lint:manifests"]
description = "Refuse a package that two manifests declare, and any in pyproject.toml"
run = "scripts/check-manifests.sh"

["lint:placement"]
description = "Refuse a script that sits in the wrong directory"
run = "scripts/check-placement.sh"

["lint:readers"]
description = "Refuse a tracked file that reaches no actor, and a name off the roster"
run = "scripts/check-readers.sh"

["lint:records"]
description = "Refuse a decision record that breaks a rule a command can decide"
run = "scripts/check-records.sh"

["lint:rust"]
description = "Refuse unformatted Rust, a Rust lint, or a broken link in the Rust documentation"
run = ["cargo fmt --check", "cargo clippy --all-targets", "cargo doc --no-deps"]

["lint:shell"]
description = "Refuse a shell defect or unformatted shell"
run = [
  "shellcheck -x $(git ls-files {{vars.shell_files}})",
  "shfmt --diff $(git ls-files {{vars.shell_files}})",
]

["lint:style"]
description = "Refuse a line that breaks the style every editor reads"
run = "ec"

["sign-off"]
description = "Sign every commit on your branch. A person runs this, never an agent"
# Hidden because that listing is what an agent reads to find what it may run.
hide = true
run = "scripts/sign-branch.sh"

[test]
description = "Every test, in one command"
depends = ["test:*"]

#   the decision:  docs/decisions/a-script-that-needs-a-rust-library-is-a-cargo-script.md
["test:cargo-scripts"]
description = "Run the tests inside each cargo script"
run = '''
git ls-files {{vars.cargo_scripts}} | while read -r s; do
  cargo -Zscript test --release --locked --manifest-path "$s" --target-dir target/scripts \
    --config "resolver.lockfile-path=\"$PWD/${s%/*}/Cargo.lock\"" || exit 1
done
'''

["test:rust"]
description = "Run the Rust tests"
# A plain `cargo test` leaves `extension-module` off, so PyO3 links libpython
# and the test binary must find it again at run time. macOS does not search the
# interpreter's own library directory, and the binary aborts as it loads.
# https://pyo3.rs/v0.29.2/building-and-distribution#dynamically-embedding-the-python-interpreter
#
# The assignment is rendered on macOS alone, the one platform that needs it.
#
#   the decision:  docs/decisions/the-crate-carries-an-rlib.md
run = """
{% if os() == "macos" %}export DYLD_FALLBACK_LIBRARY_PATH=$(python -c \
'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')
{% endif %}cargo test --all-targets && cargo test --doc
"""

["test:shell"]
description = "Run purba's own scripts against the shapes they refuse"
#   the decision:  docs/decisions/purba-writes-its-scripts-in-bash-until-purba-can-test-them.md
#
# bats names the line that failed and never what the script wrote, so the flag
# prints the script's output beside it.
run = "bats --print-output-on-failure --recursive scripts/test"
