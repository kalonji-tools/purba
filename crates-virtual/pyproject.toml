# PROTOTYPE for #537: only what the wheel section needs.
[build-system]
requires = []
build-backend = "maturin"

[project]
name = "purba"
version = "0.0.0"
requires-python = ">=3.12"

[project.scripts]
purba = "purba:_main"

[tool.maturin]
module-name = "purba"
manifest-path = "crates/purba/Cargo.toml"
features = ["extension-module"]
