[package]
name = "purba"
# git-cliff computes the version and it is never chosen by hand (#24). `0.0.0`
# is the pre-release placeholder: there are no tags yet, so there is nothing for
# git-cliff to compute from. purba stays 0.x.
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "A Python test framework written in Rust"
repository = "https://github.com/kalonji-tools/purba"
# A cdylib cannot be a library dependency, so nothing downstream can consume
# this crate (#24). The Rust crate surface is explicitly outside purba's public
# API, and docs.rs only builds published crates — which is why `cargo doc` is a
# CI lint here rather than a published site (#28).
publish = false

# `rust-version` is deliberately absent. It is a claim about consumers, and
# `publish = false` plus a cdylib means purba has none.

[lib]
name = "purba"
# NOT ["cdylib"] alone. With a bare cdylib, `cargo test` prints GREEN and
# silently omits the `Doc-tests` section entirely, while `cargo doc` renders
# examples beautifully — a published, rendered, WRONG example under a green CI.
# Cargo's `Target::doctestable()` admits only Rlib | Lib | ProcMacro, and PyO3's
# guide never mentions this. The extra `rlib` is inert to maturin: the abi3
# wheel is byte-identical (#28).
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }

[features]
# NOT a default feature. `extension-module` omits libpython, which breaks
# `cargo test --doc` and `cargo doc` — the two lints #28 put in quality.yml.
# maturin turns this on via [tool.maturin] features; plain cargo leaves it off.
extension-module = ["pyo3/extension-module"]

[lints.rust]
warnings = "deny"

[lints.rustdoc]
# rustdoc reports a broken link as a warning and exits 0, so without this
# `cargo doc` builds the documentation and refuses nothing. Only the crate-level
# `//!` block is reached: rustdoc does not document a private item, so it never
# lints one either.
# https://doc.rust-lang.org/rustdoc/lints.html
all = "deny"

[lints.clippy]
# `priority = -1` is load-bearing on every group in this table. Without it cargo
# refuses the manifest with "lint group `pedantic` has the same priority (0) as
# a lint", and the two exclusions below never apply.
# https://doc.rust-lang.org/cargo/reference/manifest.html#the-lints-section
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# pyo3's `#[pymodule]` expects `Result<(), PyErr>`, so dropping the wrap is
# `error[E0308]` rather than a tidier signature.
unnecessary_wraps = "allow"
# `syn` 2.x and 3.x both arrive through dependencies. purba names neither.
multiple_crate_versions = "allow"

[lints.cargo]
# A manifest lint is not a rustc lint, so this warned on every preflight while
# preflight exited 0.
unused_dependencies = "deny"
