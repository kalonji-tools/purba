#   the decision:  docs/decisions/every-crate-lives-under-crates.md
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/kalonji-tools/purba"
# The Rust crates are outside purba's public surface.
publish = false

# `rust-version` is deliberately absent. It is a claim about consumers, and
# `publish = false` means purba has none.

[workspace.dependencies]
pyo3 = "0.29.2"
#   the decision:  docs/decisions/purba-parses-python-with-ruff.md
ruff_python_ast = "=0.0.17"
ruff_python_parser = "=0.0.17"
ruff_text_size = "=0.0.17"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.rustdoc]
# rustdoc reports a broken link as a warning and exits 0, so without this
# `cargo doc` builds the documentation and refuses nothing. Only the crate-level
# `//!` block is reached: rustdoc does not document a private item, so it never
# lints one either.
# https://doc.rust-lang.org/rustdoc/lints.html
all = "deny"

[workspace.lints.clippy]
# `priority = -1` is load-bearing on every group in this table. Without it cargo
# refuses the manifest with "lint group `pedantic` has the same priority (0) as
# a lint", and the two exclusions below never apply.
# https://doc.rust-lang.org/cargo/reference/manifest.html#the-lints-section
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# pyo3's `#[pymodule]` expects `Result<(), PyErr>`, so dropping the wrap is
# `error[E0308]` rather than a tidier signature.
unnecessary_wraps = "allow"
# `syn` 2.x and 3.x both arrive through dependencies. purba names neither.
multiple_crate_versions = "allow"

[workspace.lints.cargo]
# A manifest lint is not a rustc lint, so this warned on every `check` while
# `check` exited 0.
unused_dependencies = "deny"
