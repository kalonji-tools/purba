# Manifest format: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "purba"
# git-cliff computes the version and it is never chosen by hand. `0.0.0` holds
# the place until the first tag gives it something to compute from.
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "A Python test framework written in Rust"
repository = "https://github.com/kalonji-tools/purba"
publish = false

# `rust-version` is absent: it is a claim about consumers, and `publish = false`
# plus a cdylib leaves purba none.

[lib]
name = "purba"
# docs/decisions/the-crate-carries-an-rlib.md
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3-py311 is the floor of the cp311-cp314 target range.
pyo3 = { version = "0.29.2", features = ["abi3-py311"] }

# docs/decisions/purba-parses-python-with-ruff.md
ruff_python_parser = "=0.0.12"
ruff_python_ast    = "=0.0.12"
# The Ranged trait; `Expr::range()` does not resolve without it.
ruff_text_size     = "=0.0.12"
# LineIndex.
ruff_source_file   = "=0.0.12"

[features]
# docs/decisions/the-crate-carries-an-rlib.md
extension-module = ["pyo3/extension-module"]
