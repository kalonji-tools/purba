# The thread on a pull request that changes a decision record.
#
#   the rule:      docs/decisions/a-record-is-rewritten-not-amended.md
#   what you owe:  CONTRIBUTING.md
#
# Never gate this. The thread has to be readable while the reviewer decides,
# not after they approve.
name: Records

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  decision-records:
    name: Decision-record thread
    # `pull_request` only. A review event carries the same payload, and the
    # marker check below would then be the only thing stopping a second
    # thread, which is a guard too far downstream to rely on.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The script reads no git state and writes through the API, so it needs
      # neither history nor a credential left behind on disk. It needs the
      # checkout only because a workflow cannot run a file it has not fetched.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Post the thread
        run: .github/scripts/post-record-thread.sh
