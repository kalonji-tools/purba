# The comment on a pull request that changes a decision record.
#
#   the rule:      docs/decisions/a-record-is-rewritten-not-amended.md
#   why it posts:  docs/decisions/a-gate-owns-the-mechanical.md
#   what you owe:  CONTRIBUTING.md
#
# Never gate this, and the endpoint is what keeps that true. It posts an issue
# comment, because the ruleset requires every review thread to be resolved. A
# resolved thread shows that someone clicked, never that they judged.
name: Records

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  decision-records:
    name: Decision-record comment
    # `pull_request` only. A review event carries the same payload, and the
    # marker check below would then be the only thing stopping a second
    # comment, which is a guard too far downstream to rely on.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The script reads no git state and writes through the API, so it needs
      # neither history nor a credential left behind on disk. It needs the
      # checkout only because a workflow cannot run a file it has not fetched.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Post the comment
        run: .github/scripts/post-record-thread.sh
