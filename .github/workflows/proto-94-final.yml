# PROTOTYPE. This file must never reach `main`.
#
# Two arms, after the manager decision was made, to choose its shape:
#
#   A  mise alone. zig supplies the C toolchain.
#   B  mise owns every tool version; devenv is the system layer only.
#
# Both are measured across architecture as well as operating system, because a
# wheel is built per platform and arm64 is where a missing prebuilt binary
# first appears.
#
# Read every row against the baseline: a GitHub runner already carries a C
# compiler and a rustup, so neither arm can prove here that its own compiler was
# necessary. It can only show which compiler was used and what came out.
name: proto-94-final

on:
  push:
    branches: [proto/94-first-class-path]

permissions:
  contents: read

jobs:
  arm-a:
    name: A mise+zig ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - name: Place arm A's config
        shell: bash
        run: cp prototype/arm-a/mise.toml mise.toml && cp prototype/arm-a/mise.lock mise.lock

      - uses: jdx/mise-action@v4
        env:
          MISE_PYTHON_COMPILE: "0"

      - name: Build the wheel, preferring zig
        shell: bash
        run: |
          start=$(date +%s)
          mkdir -p "$RUNNER_TEMP/shim"

          # Force zig where a Unix-style `cc` is what build scripts call. On the
          # msvc target rustc drives link.exe directly and never consults `cc`,
          # so the shim is inert there and the fallback below reports it.
          if [ "$RUNNER_OS" != "Windows" ]; then
            printf '#!/bin/sh\nexec "%s" cc "$@"\n' "$(mise which zig)" > "$RUNNER_TEMP/shim/cc"
            chmod +x "$RUNNER_TEMP/shim/cc"
            export PATH="$RUNNER_TEMP/shim:$PATH"
          fi

          if maturin build --zig --out dist > build.log 2>&1; then
            used='zig'
          else
            echo "--- zig attempt failed, falling back to the host toolchain ---"
            tail -15 build.log || true
            export PATH="${PATH#"$RUNNER_TEMP/shim:"}"
            if maturin build --out dist > build2.log 2>&1; then
              used='host toolchain, zig refused this platform'
            else
              used='NEITHER'
              tail -15 build2.log || true
            fi
          fi
          echo "COMPILER_USED=$used" >> "$GITHUB_ENV"
          echo "ELAPSED=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Cross the bridge, which building does not prove
        if: always()
        shell: bash
        run: |
          # A wheel that compiles and links is not a wheel a Python interpreter
          # can load. The crate's own doc comment says a verified Rust example
          # covers the core and never the bridge, so the bridge needs this.
          wheel="$(ls dist/*.whl 2>/dev/null | head -1)"
          if [ -z "$wheel" ]; then
            echo "BRIDGE=⚠️ **no wheel to import**" >> "$GITHUB_ENV"
            exit 0
          fi
          uv venv "$RUNNER_TEMP/v"
          vpy="$RUNNER_TEMP/v/bin/python"
          [ "$RUNNER_OS" = "Windows" ] && vpy="$RUNNER_TEMP/v/Scripts/python.exe"
          if uv pip install --python "$vpy" "$wheel" && \
             out="$("$vpy" prototype/bridge_check.py 2>&1)"; then
            echo "BRIDGE=**loaded** \`$(printf "%s" "$out" | sed -n "s/^extension: .*[\\/]//p")\`" >> "$GITHUB_ENV"
            echo "imported: $out"
          else
            echo "BRIDGE=⚠️ **FAILED to import**" >> "$GITHUB_ENV"
            echo "$out"
            exit 1
          fi

      - name: Manifest
        if: always()
        shell: bash
        run: |
          bash prototype/probe.sh "arm A, mise plus zig" "${{ matrix.os }}"
          wheel="$(ls dist/*.whl 2>/dev/null | head -1)"
          {
            printf '| wheel | `%s` |\n' "$(basename "${wheel:-none}")"
            printf '| verdict | **%s** in %ss cold |\n\n' "$([ -n "$wheel" ] && echo built || echo FAILED)" "${ELAPSED:-?}"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          test -n "$wheel"

  arm-b:
    name: B mise+devenv ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # No Windows leg. devenv reaches Windows only through WSL2, which a Windows
    # runner does not usefully provide. Recorded, not measured.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v5

      - name: Place arm B's config
        shell: bash
        run: |
          cp prototype/arm-b/mise.toml mise.toml
          cp prototype/arm-b/mise.lock mise.lock
          cp prototype/arm-b/devenv.nix prototype/arm-b/devenv.yaml prototype/arm-b/devenv.lock .

      - uses: jdx/mise-action@v4
        env:
          MISE_PYTHON_COMPILE: "0"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Build the wheel inside the system layer
        shell: bash
        run: |
          start=$(date +%s)
          # mise shims must win over the runner's preinstalled rustup, so the
          # toolchain here is demonstrably mise's and not the image's.
          export PATH="$HOME/.local/share/mise/shims:$PATH"
          devenv shell --quiet -- bash -c 'maturin build --out dist 2>&1 | tail -8'
          echo "COMPILER_USED=devenv" >> "$GITHUB_ENV"
          echo "ELAPSED=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Cross the bridge, which building does not prove
        if: always()
        shell: bash
        run: |
          # A wheel that compiles and links is not a wheel a Python interpreter
          # can load. The crate's own doc comment says a verified Rust example
          # covers the core and never the bridge, so the bridge needs this.
          wheel="$(ls dist/*.whl 2>/dev/null | head -1)"
          if [ -z "$wheel" ]; then
            echo "BRIDGE=⚠️ **no wheel to import**" >> "$GITHUB_ENV"
            exit 0
          fi
          uv venv "$RUNNER_TEMP/v"
          vpy="$RUNNER_TEMP/v/bin/python"
          [ "$RUNNER_OS" = "Windows" ] && vpy="$RUNNER_TEMP/v/Scripts/python.exe"
          if uv pip install --python "$vpy" "$wheel" && \
             out="$("$vpy" prototype/bridge_check.py 2>&1)"; then
            echo "BRIDGE=**loaded** \`$(printf "%s" "$out" | sed -n "s/^extension: .*[\\/]//p")\`" >> "$GITHUB_ENV"
            echo "imported: $out"
          else
            echo "BRIDGE=⚠️ **FAILED to import**" >> "$GITHUB_ENV"
            echo "$out"
            exit 1
          fi

      - name: Manifest
        if: always()
        shell: bash
        run: |
          export PATH="$HOME/.local/share/mise/shims:$PATH"
          bash prototype/probe.sh "arm B, mise plus devenv" "${{ matrix.os }}"
          wheel="$(ls dist/*.whl 2>/dev/null | head -1)"
          {
            printf '| wheel | `%s` |\n' "$(basename "${wheel:-none}")"
            printf '| verdict | **%s** in %ss cold |\n\n' "$([ -n "$wheel" ] && echo built || echo FAILED)" "${ELAPSED:-?}"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          test -n "$wheel"

  # Arm C isolates the one variable that broke arm A on aarch64 Linux. Arm A
  # forces `cc` to zig so nothing is needed from the host. That is what rejected
  # rustc's `--fix-cortex-a53-843419`, which it emits by default on aarch64 and
  # zig's linker does not implement. Arm C keeps `--zig` for the target build and
  # leaves the host's own compiler to build scripts.
  #
  # It trades self-containment for reach, and this job measures the trade rather
  # than assuming it.
  arm-c:
    name: C zig target-only ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - name: Place arm A's config, which arm C shares
        shell: bash
        run: cp prototype/arm-a/mise.toml mise.toml && cp prototype/arm-a/mise.lock mise.lock

      - uses: jdx/mise-action@v4
        env:
          MISE_PYTHON_COMPILE: "0"

      - name: Build with zig for the target and the host compiler for build scripts
        shell: bash
        run: |
          start=$(date +%s)
          if maturin build --zig --out dist > build.log 2>&1; then
            echo "COMPILER_USED=zig for the target, host for build scripts" >> "$GITHUB_ENV"
          else
            echo "COMPILER_USED=NEITHER" >> "$GITHUB_ENV"
            tail -20 build.log || true
          fi
          echo "ELAPSED=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Cross the bridge, which building does not prove
        if: always()
        shell: bash
        run: |
          wheel="$(ls dist/*.whl 2>/dev/null | head -1)"
          if [ -z "$wheel" ]; then
            echo "BRIDGE=⚠️ **no wheel to import**" >> "$GITHUB_ENV"
            exit 0
          fi
          uv venv "$RUNNER_TEMP/v"
          vpy="$RUNNER_TEMP/v/bin/python"
          [ "$RUNNER_OS" = "Windows" ] && vpy="$RUNNER_TEMP/v/Scripts/python.exe"
          if uv pip install --python "$vpy" "$wheel" && \
             out="$("$vpy" prototype/bridge_check.py 2>&1)"; then
            echo "BRIDGE=**loaded**" >> "$GITHUB_ENV"
            echo "$out"
          else
            echo "BRIDGE=⚠️ **FAILED to import**" >> "$GITHUB_ENV"
            echo "$out"
            exit 1
          fi

      - name: Manifest
        if: always()
        shell: bash
        run: |
          bash prototype/probe.sh "arm C, zig target-only" "${{ matrix.os }}"
          wheel="$(ls dist/*.whl 2>/dev/null | head -1)"
          {
            printf '| wheel | `%s` |\n' "$(basename "${wheel:-none}")"
            printf '| verdict | **%s** in %ss cold |\n\n' "$([ -n "$wheel" ] && echo built || echo FAILED)" "${ELAPSED:-?}"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          test -n "$wheel"
