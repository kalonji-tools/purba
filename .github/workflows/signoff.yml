# Human sign-off for agent-written code.
#
# This file is out of step with the decision it implements, knowingly. It still
# gates on a deployment environment, and nothing here writes a trailer.
#
#   the decision: docs/decisions/liability-is-recorded-from-the-act-that-makes-it-true.md
#   the rewrite:  https://github.com/kalonji-tools/purba/issues/103
#
# Two things break this file if you change them without knowing why:
#
#   1. The `signoff` environment must already exist WITH its reviewer list.
#      GitHub creates a missing environment silently, with no protection rules,
#      and the gate would then pass without anyone approving anything.
#   2. A required check that never reports blocks the merge. That is the only
#      reason this gate fails closed rather than open.
#
# A third is on the `signoff` job itself, where the change would be made.
#
# Known limit, not fixed: a pull request from a FORK receives a read-only
# GITHUB_TOKEN whatever the `permissions:` block says. Such a pull request waits
# for approval, a human grants it, and the job then fails on the first write, so
# the reviewer has spent a click for nothing.
#
# A FIRST-TIME contributor never reaches that point. The run reports
# `action_required`, never starts, and writes no check run at all. Both were
# measured, and the gate still fails closed either way.
#
# Detecting it before the gate needs a second job, and the required context
# would then be a job GitHub can skip, which the `signoff` job explains is
# unsafe.
name: Sign-off

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

# Only the newest head is worth approving. Without this, every push leaves its
# own approval request pending for up to 30 days and the reviewer is shown
# several, with nothing to say which is current. Two were stranded on one branch
# before this was added.
concurrency:
  group: signoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # Naming the approver reads the run's approvals, which needs `actions: read`.
  # Without it the job fails rather than recording a sign-off with no name.
  actions: read

jobs:
  signoff:
    name: Sign-off
    # This job carries NO draft guard, and that is load-bearing.
    #
    # A job skipped by an `if:` still writes a check run, with conclusion
    # `skipped`, under the same context name on the same head. `Sign-off` is a
    # REQUIRED check, and a skipped run for it was measured reporting as
    # "skipping" on a ready pull request that nobody had approved. A guard here
    # weakens the one gate this workflow exists to provide.
    #
    # The cost is that a draft prompts too. The `concurrency` group above keeps
    # that to a single live prompt: each push cancels the request before it, so
    # a draft pushed ten times leaves one. A cancelled run does not report
    # success, so the gate still fails closed while the work is in progress.
    #
    # `synchronize` is in the trigger list on purpose. A push after an approval
    # prompts again, because the approval covers what was read and not what
    # replaced it.
    runs-on: ubuntu-latest
    environment: signoff
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AGENT: snregales-agent
    steps:
      - name: Record who signed off
        run: |
          set -euo pipefail

          # Every step below runs only after a human approved, so the approvals
          # list is never empty in practice. It is checked anyway: an
          # unattributable sign-off is worse than a failed job, because it looks
          # like a record and names nobody.
          approver=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/approvals" \
            --jq 'map(select(.state == "approved")) | last | .user.login')
          if [ -z "$approver" ] || [ "$approver" = "null" ]; then
            echo "::error::the run reports no approver, so there is no sign-off to record"
            exit 1
          fi

          # The tree is read from the head commit and NOT from the last element
          # of the commits list, because `gh api --paginate` returns one array
          # per page and the last element of a page is not the last commit.
          tree=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA" --jq '.commit.tree.sha')

          # One head gets one record. A person can re-run this job by hand, and
          # without the check that would post a second record for the same head.
          # The marker carries the tree as a machine field so that anything
          # reading it never has to parse the rendered table.
          marker="<!-- purba:signoff:$HEAD_SHA:$tree -->"
          existing=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[].body')
          case "$existing" in
            *"$marker"*)
              echo "$HEAD_SHA is already recorded, skipping"
              exit 0
              ;;
          esac

          # The table below is what the signer is answerable for. A commit is
          # agent work when the agent authored it or it carries `Assisted-by:`.
          # A commit a person wrote alone is neither, and must not be rendered
          # as though something were missing from it.
          #
          # A subject containing a pipe would split the row and silently drop
          # the rest of it, so it is escaped. The record is read as evidence,
          # and evidence that renders wrongly is worse than none.
          commits=$(gh api "repos/$GH_REPO/pulls/$PR/commits" --paginate \
            | jq -r --arg agent "$AGENT" '
            def assisted:
              .commit.message | split("\n")
              | map(select(startswith("Assisted-by: "))) | last
              | if . == null then null else .[("Assisted-by: " | length):] end;
            def cell: gsub("\\|"; "\\|");
            .[]
            | assisted as $tool
            | ((.author.login // "") == $agent or $tool != null) as $agentwork
            | "| `\(.sha[0:7])` | \(.commit.message | split("\n")[0] | cell) | \(.author.login // .commit.author.name) | \(if $agentwork then $tool // "yes" else "no" end) |"
          ')

          record="## Sign-off recorded

          **@$approver has accepted responsibility for the changes below.**

          An agent wrote this code. A person is answerable for it. This comment is that record.

          ### What was signed off

          | commit | subject | author | written with AI |
          |---|---|---|---|
          $commits

          ### What this covers

          - **These commits, and nothing after them.** If anyone pushes again, this record stops applying, and the change cannot merge until someone approves the new work.
          - **This comment is the record.** Nothing equivalent is written inside the commits, so this pull request is where the answerability is kept.
          - **Only a named reviewer can give it.** The agent that wrote the code cannot approve its own work.

          | | |
          |---|---|
          | signed off by | @$approver |
          | commit | \`$HEAD_SHA\` |
          | content fingerprint | \`$tree\` |
          | evidence | $RUN_URL |

          The fingerprint identifies exactly what was approved. It does not change when the commit is replayed at merge, so it stays true of the code on \`main\`.
          $marker"

          echo "$record" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GH_REPO/issues/$PR/comments" -f body="$record" --jq .html_url
          echo "recorded sign-off by $approver for $HEAD_SHA"

  decision-records:
    name: Decision-record thread
    # Separate from the gate, and deliberately not gated: this thread must be
    # readable while the reviewer decides, not after they have approved.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Post the thread
        run: |
          set -euo pipefail

          decisions=$(gh api "repos/$GH_REPO/pulls/$PR/files" --paginate --jq '.[].filename' | LC_ALL=C sort | grep '^docs/decisions/' || true)
          if [ -z "$decisions" ]; then
            echo "the diff does not touch docs/decisions, so no thread is owed"
            exit 0
          fi

          # Anchoring is narrower than the documentation suggests, and all of
          # this was measured against a live pull request rather than read:
          # an inline comment is accepted only on a line inside a diff hunk;
          # `subject_type` is REJECTED inside a review payload; and GraphQL's
          # addPullRequestReviewThread with subjectType FILE returns a null
          # thread and creates nothing. A file-level thread exists only through
          # the standalone endpoint used below.
          marker='<!-- purba:thread:decisions -->'
          # `ready_for_review` fires again every time a draft is re-readied, so
          # without this check one question would become several required
          # resolutions.
          existing=$(gh api "repos/$GH_REPO/pulls/$PR/comments" --paginate --jq '.[].body')
          case "$existing" in
            *"$marker"*)
              echo "$marker is already present, skipping"
              exit 0
              ;;
          esac

          gh api "repos/$GH_REPO/pulls/$PR/comments" \
            -f commit_id="$HEAD_SHA" -f path="$(head -1 <<<"$decisions")" -f subject_type=file \
            -f body="**This pull request changes a decision record.**

          $(sed 's|^|- \`|; s|$|\`|' <<<"$decisions")

          A decision record states what this project decided and why, and it is read by people who were not in the conversation. Two things about it can never be checked by a tool:

          > Two things are never gateable: whether a record states one decision, and whether it is still true.
          > The code owner judges both, and is the only reader who can.

          A third has already gone wrong once. **The Decision Outcome is written by a person, or the change does not merge.** An agent writing it satisfies the letter and voids the rule.

          Resolve this thread when you have judged all three.
          $marker"
          echo "posted the decision-record thread"
