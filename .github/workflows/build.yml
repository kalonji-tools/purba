# Every gate that refuses a merge on the build and on the load.
#
#   the task:       .config/tasks.toml, under `build`
#   the tools:      .config/mise.toml
#   the paths:      .config/gates
#   the floor:      docs/decisions/purba-supports-a-python-with-two-years-left.md
#
# This gate proves the claims purba makes about its own distribution.
#
# Never add a `paths:` filter here. A check that never reports and a check that
# refuses are the same thing to the ruleset, so a filtered run blocks forever.
# The job `changed` reads what the pull request changes instead, and `Build`
# reports either way.
#
# Never add `ready_for_review` to the types below. Marking a draft ready
# changes no commit, and the ruleset reads this check on the head commit,
# whatever event made it. The page below says so. Its address cannot be
# wrapped, so the style check skips that line.
# editorconfig-checker-disable-next-line
# https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/troubleshooting-rules#troubleshooting-required-status-checks
#
# ⚠️ Never add `continue-on-error` to a job here. A tolerated arm reports
# `failure` as its own conclusion while the matrix still reports `success` to
# the rollup, so the gate passes with a failed arm inside it. Nothing in the
# rollup can recover that.
name: Build

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MISE_VERSION: 2026.9.14

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changed.outputs.build }}
    steps:
      # A pull request is checked out as its merge commit, whose first parent
      # is the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Name whether this pull request changes a path that starts Build
        id: changed
        run: .github/scripts/changed.sh build HEAD^1 HEAD >>"$GITHUB_OUTPUT"

  # Only this job exercises the library path that `.config/tasks.toml` sets for
  # this task on Linux and macOS.
  rust:
    name: rust ${{ matrix.os }}
    needs: changed
    if: needs.changed.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Name the compiler this job builds with
        run: mise exec -- rustc --version
      - name: Run the Rust tests
        run: mise run test:rust

  # Every interpreter purba supports builds the wheel and then loads it, so one
  # matrix covers both halves of the claim.
  #
  # ⚠️ Every interpreter comes from `actions/setup-python`, the floor included.
  # mise cannot supply a free-threaded build at all.
  wheel:
    name: wheel ${{ matrix.os }} py${{ matrix.python }}
    needs: changed
    if: needs.changed.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        # `3.14t` needs no job of its own: the command below is the same for it
        # as for every other arm.
        python: ['3.12', '3.13', '3.14', '3.14t']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise supplies the Rust toolchain and maturin, and runs first so that the
      # interpreter below wins the PATH.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: ${{ env.MISE_VERSION }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # `$(command -v python)` resolves in this shell, before mise starts, so it
      # names the interpreter above. Without it a mise task would build against
      # mise's own python and the matrix would change nothing.
      - name: Build against ${{ matrix.python }}
        # `run:` defaults to PowerShell on Windows, where the expansion below is
        # empty and maturin is handed `--interpreter ""`.
        shell: bash
        run: mise run build --interpreter "$(command -v python)"

      # The record requires a check a package with no Rust in it would fail, so
      # reaching the submodule is not enough on its own: its file has to be the
      # compiled extension.
      - name: Load it on ${{ matrix.python }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --no-index --find-links target/wheels purba
          python - <<'PY'
          import importlib, pathlib, sys
          path = pathlib.Path(importlib.import_module("purba.purba").__file__)
          print(f"extension: {path}")
          if path.suffix not in {".so", ".pyd", ".dylib"}:
              sys.exit(f"the submodule is not the extension: {path}")
          PY

      #   the decision:  docs/decisions/bats-tests-the-installed-wheel-from-outside-purba.md
      - name: Run the end-to-end test on ${{ matrix.python }}
        if: runner.os != 'Windows'
        run: bats --print-output-on-failure tests

  Build:
    name: Build
    needs: [changed, rust, wheel]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A failed or cancelled `changed` skips the matrix too, so a skip passes
      # only when `changed` succeeded and asked for none.
      - name: Refuse unless every job did what the job `changed` asked
        shell: bash
        env:
          RESULTS: >-
            changed=${{ needs.changed.result }}
            build=${{ needs.changed.outputs.build }}
            rust=${{ needs.rust.result }}
            wheel=${{ needs.wheel.result }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          case "$RESULTS" in
            "changed=success build=true rust=success wheel=success")
              echo "every job this gate reads reported success" ;;
            "changed=success build= rust=skipped wheel=skipped")
              echo "no path that starts Build changed, so its jobs did not run" ;;
            *)
              echo "::error::A branch is refused unless the job \`changed\` succeeded and every \
          job it started succeeded, because Build stands for every Rust test and every wheel \
          whenever a path that starts it changes. The results printed above say which."
              exit 1 ;;
          esac
