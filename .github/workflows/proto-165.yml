# A throwaway instrument for issue #165. It must never reach `main`.
#
# It answers one question: does a later `Sign-off` check run of `success`
# replace an earlier one of `failure` on the same commit, for the required
# context rather than only for the display?
name: proto-165

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  supersede:
    if: github.head_ref == 'proto/165-supersede'
    permissions:
      checks: write
      pull-requests: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Read the required contexts three times
        run: |
          set -euo pipefail

          read_rollup() {
            gh api graphql -f query='
            query($o:String!,$r:String!,$n:Int!){
              repository(owner:$o,name:$r){
                pullRequest(number:$n){
                  mergeStateStatus
                  commits(last:1){nodes{commit{statusCheckRollup{state contexts(first:50){nodes{
                    ... on CheckRun{name conclusion isRequired(pullRequestNumber:$n) completedAt}
                  }}}}}}
                }
              }
            }' -f o="${GH_REPO%/*}" -f r="${GH_REPO#*/}" -F n="$PR" --jq '
              .data.repository.pullRequest as $p |
              "  mergeState=\($p.mergeStateStatus) rollup=\($p.commits.nodes[0].commit.statusCheckRollup.state // "none")",
              ($p.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
                 | select(.name == "Sign-off")
                 | "  Sign-off\tconclusion=\(.conclusion)\trequired=\(.isRequired)\tat=\(.completedAt)")'
          }

          post() {
            gh api --method POST "repos/$GH_REPO/check-runs" \
              -f name="Sign-off" \
              -f head_sha="$SHA" \
              -f status=completed \
              -f conclusion="$1" \
              -f "output[title]=$2" \
              -f "output[summary]=An instrument for #165. This branch was never signed and never refused." \
              --jq '"  posted \(.conclusion) id=\(.id) at=\(.completed_at)"'
          }

          echo "### before anything is written"
          read_rollup

          echo "### after Sign-off=failure"
          post failure "Refused before anything was rewritten"
          sleep 10
          read_rollup

          echo "### after Sign-off=success"
          post success "Accepted by nobody, this is an instrument"
          sleep 10
          read_rollup

          echo "### every Sign-off check run on the commit"
          gh api "repos/$GH_REPO/commits/$SHA/check-runs?per_page=100&filter=all" \
            --jq '.check_runs[] | select(.name=="Sign-off") | "  \(.conclusion)\t\(.completed_at)\t\(.id)"'
