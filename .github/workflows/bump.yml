# The workflow that proposes a compiler. It signs nothing.
#
#   the work:      .github/scripts/bump-nightly.sh
#   the failure:   .github/scripts/report-run-failure.sh
#   the pin:       .config/mise.toml, under `[tools]`
#   the decisions: docs/decisions/the-nightly-is-named-by-a-date.md
#                  docs/decisions/a-workflow-is-granted-an-identity-not-a-power.md
#
# ⚠️ Keep the shell in the scripts. The only shell here calls them.
name: Bump

on:
  schedule:
    # Weekly. A nightly seven days old is always past `minimum_release_age`.
    # https://mise.jdx.dev/configuration/settings.html
    - cron: '0 6 * * 1'
  # ⚠️ This trigger exists only while this file is on the default branch.
  # https://docs.github.com/en/actions/how-tos/manage-workflow-runs/manually-run-a-workflow
  workflow_dispatch:

permissions:
  contents: write
  # The failure step below opens or comments on an issue.
  issues: write
  # `pull-requests:` is absent: the App token opens the pull request.

concurrency:
  group: bump
  # Never `true`. Cancelled between the push and the pull request, the branch
  # exists with nothing pointing at it.
  cancel-in-progress: false

env:
  MISE_VERSION: 2026.9.14
  BRANCH: bump/rust-nightly
  # The issue the bump commit cites, and the only place this number lives.
  ISSUE: 190

jobs:
  bump:
    name: bump
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `persist-credentials` stays on. The script pushes with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}

      # ⚠️ `GITHUB_TOKEN` cannot open a pull request here. The record named
      # above holds why, and what this token may and may not do.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}

      - name: Propose a nightly, or say why it proposes none
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/bump-nightly.sh "$BRANCH" "$ISSUE"

      # ⚠️ Keep this step in the workflow, not in the script, and keep it on
      # `GITHUB_TOKEN`. The App is narrowed to pull requests, so the token
      # above cannot open an issue and this step would stop reporting.
      - name: Say so where somebody reads it
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/report-run-failure.sh bump "$RUN_URL" "$ISSUE"
