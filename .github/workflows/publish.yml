# The workflow that builds the wheels of a release tag and uploads them to PyPI.
#
#   the caller:    .github/workflows/release.yml
#   the check:     .github/scripts/require-abi3.sh
#   the failure:   .github/scripts/report-run-failure.sh
#   the floor:     docs/decisions/purba-supports-a-python-with-two-years-left.md
#
# ⚠️ PyPI trusts this file by its name and by the environment below. Renaming
# either stops every upload, and nothing here says so.
# https://docs.pypi.org/trusted-publishers/
#
# ⚠️ A tag pushed with `GITHUB_TOKEN` starts no workflow, so this one listens
# for a dispatch alone. A tag pushed by hand needs the same dispatch:
#
#   gh workflow run publish.yml --ref v<version>
#
# https://docs.github.com/en/actions/concepts/security/github_token
name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_VERSION: 2026.9.14
  # The issue a failure report cites, and the only place this number lives.
  ISSUE: 48

jobs:
  # The platforms `build.yml` builds and loads on, and no others.
  wheel:
    name: wheel ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Build the wheel
        run: mise run build --release

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: target/wheels/*.whl
          if-no-files-found: error

  # Apart from `upload`, so the check runs on a ref the environment refuses.
  check:
    name: check
    needs: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Refuse a wheel that is not abi3 at the floor
        run: .github/scripts/require-abi3.sh dist

  upload:
    name: upload
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment admits a `v*` tag alone, so a dispatch on a branch builds
    # and checks, and stops here.
    environment: PyPI
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.14.2

  # How `failure()` reads the jobs this one needs:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#failure
  report:
    name: report
    needs: [wheel, check, upload]
    if: failure() && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Say so where somebody reads it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/report-run-failure.sh publish "$RUN_URL" "$ISSUE"
