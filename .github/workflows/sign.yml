# The job that accepts a branch.
#
#   the rules:     scripts/check-origin.sh
#                  scripts/check-replayable.sh
#   the advisory:  .github/workflows/commits.yml
#   the decision:  docs/decisions/liability-is-recorded-from-the-act-that-makes-it-true.md
#                  docs/decisions/a-finished-gate-runs-sign-with-the-scripts-of-main.md
#   what you owe:  CONTRIBUTING.md
#
# Another workflow may name this one, so the workflow name is load-bearing
# and a rename reports to nobody.
#
# The traps below are easy to trip and hard to debug. Each one says why.
name: Sign-off

on:
  # Keep all three triggers.
  # Updating a branch writes new commits, and a new commit has no check runs
  # on it. The approval stays, so no review event arrives. With only
  # `pull_request_review`, nothing would report the check again and the pull
  # request could never merge.
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_run:
    # The ruleset is not in the tree. It requires the jobs named Quality and
    # Build, not Scripts, Quality-macOS or Scripts-macOS. A red one of those
    # three withholds Sign-off instead.
    workflows: [Quality, Build, Scripts]
    types: [completed]

concurrency:
  group: sign-${{ github.event.pull_request.number ||
    github.event.workflow_run.pull_requests[0].number }}
  # Never `true`. This job pushes first and reports the check second. Cancel
  # it in between, and the branch keeps the rewrite but loses the check.
  # Nothing runs again to add one.
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
  GATES: Quality Build Scripts Quality-macOS Scripts-macOS
  # A subset of GATES. `carry-verdicts.sh` says why the two are not one list.
  CARRYABLE: Quality Build Scripts Quality-macOS Scripts-macOS

jobs:
  sign:
    permissions:
      contents: write
      pull-requests: read
      # This job rewrites the commits, and the new commits have no check runs
      # on them. So the job reports the required check itself.
      checks: write
    # Never call this job `Sign-off`. A job writes a check run under its own
    # name, so that name must not be the required one. The step that writes
    # the acceptance trailer reports `Sign-off` on purpose instead.
    name: sign
    # A run that a finished gate starts reports on the head of `main`, so a
    # refusal there marks `main` red. On the pull request's own events, the
    # first step refuses the fork on its head.
    if: github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # Bounded, because `cancel-in-progress` is false and a hung run would hold
    # the queue for six hours.
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
    steps:
      # This step must stay first. A fork's branch does not exist in this
      # repository. The checkout below fails on it. Any step placed after the
      # checkout would never run.
      - name: Refuse a pull request from a fork
        if: (github.event.pull_request.head.repo.full_name ||
          github.event.workflow_run.head_repository.full_name) != github.repository
        run: |
          echo "::error::A pull request from a fork is refused, because this job may only read \
          here and cannot sign it. purba takes your contribution another way: see CONTRIBUTING.md."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      # A finished gate starts this run on `main`. Never run a script from the
      # checkout there, because a cache that it saves is one that each gate and
      # Publish restore:
      # https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
      - name: Take the scripts from main
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          mkdir "${RUNNER_TEMP}/main"
          git archive "${GITHUB_SHA}" .github/scripts scripts | tar -x -C "${RUNNER_TEMP}/main"
          echo "SCRIPTS=${RUNNER_TEMP}/main" >>"${GITHUB_ENV}"

      - name: Write the acceptance trailer into every commit
        id: accept
        run: |
          "${SCRIPTS:-.}/.github/scripts/write-acceptance-trailer.sh"
      - name: Carry the verdicts the content still answers for
        if: steps.accept.outputs.after != ''
        continue-on-error: true
        env:
          BEFORE: ${{ steps.accept.outputs.before }}
          AFTER: ${{ steps.accept.outputs.after }}
        run: |
          "${SCRIPTS:-.}/.github/scripts/carry-verdicts.sh" "$BEFORE" "$AFTER" $CARRYABLE
