# The workflow that proposes a release, tags it once it merges, and starts
# Publish on the tag. It signs nothing.
#
#   the work:      .github/scripts/release.sh
#   the failure:   .github/scripts/report-run-failure.sh
#   the upload:    .github/workflows/publish.yml
#   the register:  .config/cliff.toml
#   the decision:  docs/decisions/a-workflow-is-granted-an-identity-not-a-power.md
#
# ⚠️ Keep the shell in the scripts. Each `run:` here is one command.
name: Release

on:
  schedule:
    - cron: '0 9 * * 1'
  # ⚠️ This trigger exists only while this file is on the default branch.
  # https://docs.github.com/en/actions/how-tos/manage-workflow-runs/manually-run-a-workflow
  workflow_dispatch:

permissions:
  # The script pushes the proposal branch and the tag with this token.
  contents: write
  # The failure step below opens or comments on an issue.
  issues: write
  # The publish step below dispatches a workflow.
  actions: write
  # `pull-requests:` is absent: the App token opens the pull request.

concurrency:
  group: release
  # Never `true`. Cancelled between the push and the pull request, the branch
  # exists with nothing pointing at it.
  cancel-in-progress: false

env:
  MISE_VERSION: 2026.9.14
  BRANCH: release/next
  # The issue the release commit cites, and the only place this number lives.
  ISSUE: 43

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `persist-credentials` stays on. The script pushes with it.
      # git-cliff computes the version from every tag, so the clone is whole.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}

      # ⚠️ `GITHUB_TOKEN` cannot open a pull request here. The record named
      # above holds why, and what this token may and may not do.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}

      - name: Tag the version main names, or propose the next
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/release.sh "$BRANCH" "$ISSUE"

      # ⚠️ Keep this on `GITHUB_TOKEN`. A tag that token pushes starts no workflow,
      # and a dispatch it sends always starts one. The App holds no Actions
      # permission.
      # https://docs.github.com/en/actions/concepts/security/github_token
      - name: Publish the tag it pushed
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run publish.yml --ref "$TAG"

      # ⚠️ Keep this step in the workflow, not in the script, and keep it on
      # `GITHUB_TOKEN`. The App is narrowed to pull requests, so the token
      # above cannot open an issue and this step would stop reporting.
      - name: Say so where somebody reads it
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/report-run-failure.sh release "$RUN_URL" "$ISSUE"
