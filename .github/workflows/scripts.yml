# The gate that refuses a merge on a failing test of purba's own scripts, or of
# a cargo script.
#
#   the tasks:     .config/tasks.toml, under `test:shell` and `test:cargo-scripts`
#   the tools:     .config/mise.toml
#   the paths:     .config/gates
#   the decision:  docs/decisions/purba-writes-its-scripts-in-bash-until-purba-can-test-them.md
#
# Never add a `paths:` filter here. A check that never reports and a check that
# refuses are the same thing to `sign.yml`, which waits for this one, so a
# filtered run blocks forever.
# The job reads what the pull request changes instead, and reports either way.
#
# Never add `ready_for_review` to the types below. Marking a draft ready
# changes no commit, and `sign.yml` reads this check on the head commit,
# whatever event made it.
#
# ⚠️ `sign.yml` names this workflow, and names its job in two more lists. A
# rename here that does not reach all three stops every branch from merging.
name: Scripts

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MISE_VERSION: 2026.9.14

jobs:
  scripts:
    # One word, because `sign.yml` splits its lists on spaces.
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A pull request is checked out as its merge commit, whose first parent
      # is the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Name whether this pull request changes a path that starts the script tests
        id: changed
        run: .github/scripts/changed.sh scripts HEAD^1 HEAD >>"$GITHUB_OUTPUT"

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        if: steps.changed.outputs.scripts == 'true'
        with:
          version: ${{ env.MISE_VERSION }}

      # .github/workflows/cargo-scripts.yml fills this cache on main.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changed.outputs.scripts == 'true'
        with:
          path: target/scripts
          key: "cargo-scripts-\
            ${{ hashFiles('scripts/**/Cargo.lock', '.github/**/Cargo.lock', '.config/mise.toml') }}"

      - name: Refuse a script that fails its own test
        if: steps.changed.outputs.scripts == 'true'
        run: mise run test:shell

      - name: Refuse a cargo script that fails its own test
        if: steps.changed.outputs.scripts == 'true'
        run: mise run test:cargo-scripts
