# PROTOTYPE. This file must never reach `main`.
#
# It answers two questions that cannot be answered on the developer's NixOS
# machine: whether a workflow fires on a push to a branch with no pull request
# (purba has never done this: every run in its history is `pull_request`), and
# what a bare runner already carries before any environment manager touches it.
#
# The second half is not throwaway. GitHub's runners ship a Rust toolchain and a
# C compiler already, so an arm can appear to succeed on tools it never
# installed. This job records that confound before any arm runs.
name: proto-94

on:
  push:
    branches: [proto/94-first-class-path]

permissions:
  contents: read

jobs:
  baseline:
    name: baseline ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Inventory the bare runner
        shell: bash
        run: |
          # Absence is data, so nothing here may fail the job.
          probe() {
            local name="$1"
            local path
            path="$(command -v "$name" 2>/dev/null || true)"
            if [ -z "$path" ]; then
              printf '| `%s` | absent | |\n' "$name" >> "$GITHUB_STEP_SUMMARY"
            else
              local version
              version="$("$name" --version 2>&1 | head -1 | tr -d '\r' || true)"
              printf '| `%s` | present | %s |\n' "$name" "$version" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          {
            printf '## %s\n\n' "${{ matrix.os }}"
            printf 'runner arch: `%s`\n\n' "$(uname -m 2>/dev/null || echo unknown)"
            printf '| tool | state | version |\n|---|---|---|\n'
          } >> "$GITHUB_STEP_SUMMARY"

          for tool in cc gcc clang ld rustc cargo rustup python python3 uv maturin just prek mise devenv nix; do
            probe "$tool"
          done

          # `link.exe` is the Windows linker and does not answer to --version.
          if [ "${{ runner.os }}" = "Windows" ]; then
            if command -v link >/dev/null 2>&1; then
              printf '| `link` | present | MSVC linker on PATH |\n' >> "$GITHUB_STEP_SUMMARY"
            else
              printf '| `link` | absent | |\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  # Arm 2 and arm 3 are indistinguishable on a GitHub runner, because the
  # baseline job proves every runner already carries a C compiler. This job
  # therefore answers one question only: does mise serve all three operating
  # systems? The question of whether devenv is needed for the system layer is
  # answered on the developer's machine, not here.
  arm-mise:
    name: arm-mise ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: --locked
        env:
          MISE_PYTHON_COMPILE: "0"

      - name: Manifest
        shell: bash
        run: |
          {
            printf '## arm-mise %s\n\n' "${{ matrix.os }}"
            printf '| probe | value |\n|---|---|\n'
            printf '| rustc | %s |\n' "$(mise exec rust -- rustc --version 2>&1 | tr -d '\r')"
            printf '| cargo | %s |\n' "$(mise exec rust -- cargo --version 2>&1 | tr -d '\r')"
            printf '| clippy | %s |\n' "$(mise exec rust -- cargo-clippy --version 2>&1 | tr -d '\r')"
            printf '| rustfmt | %s |\n' "$(mise exec rust -- rustfmt --version 2>&1 | tr -d '\r')"
            printf '| python | %s |\n' "$(python --version 2>&1 | tr -d '\r')"
            printf '| maturin | %s |\n' "$(maturin --version 2>&1 | tr -d '\r')"
            printf '| just | %s |\n' "$(just --version 2>&1 | tr -d '\r')"
            printf '| prek | %s |\n' "$(prek --version 2>&1 | tr -d '\r')"
            printf '| uv | %s |\n' "$(uv --version 2>&1 | tr -d '\r')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The criterion, a wheel
        shell: bash
        run: |
          start=$(date +%s)
          if maturin build --out dist 2>&1 | tail -20; then
            verdict="built"
          else
            verdict="FAILED"
          fi
          elapsed=$(( $(date +%s) - start ))
          wheel="$(ls dist/*.whl 2>/dev/null | head -1)"
          {
            printf '| wheel | %s |\n' "${wheel:-none}"
            printf '| verdict | **%s** in %ss |\n\n' "$verdict" "$elapsed"
          } >> "$GITHUB_STEP_SUMMARY"
          test -n "$wheel"

  # The devenv arm gets no Windows leg. WSL2 is not usable on a Windows runner,
  # and a job that confirms a documented impossibility buys nothing.
  arm-devenv:
    name: arm-devenv ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Manifest and the criterion
        shell: bash
        run: |
          start=$(date +%s)
          devenv shell --quiet -- bash -c '
            {
              printf "## arm-devenv ${{ matrix.os }}\n\n"
              printf "| probe | value |\n|---|---|\n"
              printf "| rustc | %s |\n" "$(rustc --version)"
              printf "| cargo | %s |\n" "$(cargo --version)"
              printf "| rustfmt | %s |\n" "$(rustfmt --version)"
              printf "| python | %s |\n" "$(python --version 2>&1)"
              printf "| maturin | %s |\n" "$(maturin --version)"
            } >> "$GITHUB_STEP_SUMMARY"
            maturin build --out dist 2>&1 | tail -10
          '
          elapsed=$(( $(date +%s) - start ))
          wheel="$(ls dist/*.whl 2>/dev/null | head -1)"
          {
            printf '| wheel | %s |\n' "${wheel:-none}"
            printf '| verdict | **%s** in %ss, cold |\n\n' "$([ -n "$wheel" ] && echo built || echo FAILED)" "$elapsed"
          } >> "$GITHUB_STEP_SUMMARY"
          test -n "$wheel"
