# Prototype for the build gate. Probes C, D, E and F. This branch is never merged.
#
# The probes A and B ran locally. prototype/README.md holds their results.
#
# This workflow is deliberately not called `Quality`, `Sign-off`, `Commits` or
# `Records`. `sign.yml` triggers on a `workflow_run` of `Quality`, and a name
# collision here would wake the job that accepts a branch.
#
# Every job says what a failure proves. A green run that proves nothing is the
# failure mode a prototype exists to avoid.
name: Prototype 42

on:
  push:
    branches: [proto/42-build-gate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- PROBE C
  # `tasks.toml` carries a macOS workaround for `test:rust` and a note that
  # Windows runs a task through cmd. Nobody has ever run it off Linux.
  # A failure here means the Rust job needs a narrower platform set than the
  # wheel, and one Rust job across three operating systems is the wrong shape.
  c-rust:
    name: C rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Run the Rust tests
        run: mise run test:rust

  # ---------------------------------------------------------------- PROBE D1
  # The floor builds the abi3 wheel. One build per operating system, because an
  # abi3 wheel is platform-specific and version-independent.
  #
  # `actions/upload-artifact` is GitHub's name. CONTEXT.md reserves "artifact"
  # for what purba writes for a reader, and excludes a file a job uploads. So
  # every name and message here says "the wheel".
  d1-build-floor:
    name: D build the wheel on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Report the interpreter the floor builds against
        run: mise x -- python -c "import sys, sysconfig; print(sys.version); print('GIL disabled:', sysconfig.get_config_var('Py_GIL_DISABLED'))"
      - name: Build the wheel
        run: mise run build
      - name: Name the wheel this job produced
        shell: bash
        run: ls -l target/wheels/
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: target/wheels/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------- PROBE D2
  # `pyproject.toml` sets `requires-python = ">=3.12"` with no upper bound. The
  # record justifies the missing bound: an abi3 wheel loads on a version that
  # did not exist when it was built. Nothing has ever tested that.
  #
  # A failure here means `requires-python` accepts a version the wheel does not
  # serve, and that is a false claim in the tree today.
  d2-install-above-floor:
    name: D install on ${{ matrix.os }} py${{ matrix.python }}
    needs: d1-build-floor
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist
      - name: Install the wheel the floor built
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist/
          python -m pip install --no-index --find-links dist purba
      # ⚠️ The first version of this step asserted on `purba.__file__` and failed
      # on all six arms, while the wheel installed cleanly every time. maturin
      # writes a package wrapper into the wheel — `purba/__init__.py` holding
      # `from .purba import *`, beside `purba/purba.abi3.so` — so the package's
      # own file attribute is the `__init__.py`.
      #
      # The record on the mise substrate names this exact trap and says a check
      # written that way passes for a package that holds no Rust. Here it did the
      # opposite and failed for a package that does hold Rust. Both readings are
      # wrong for the same reason: the check must reach the submodule.
      #
      # This step measures both, so the trap stays visible rather than fixed and
      # forgotten.
      - name: Import the extension and read its file suffix
        shell: bash
        run: |
          set -euo pipefail
          python -c "
          import importlib, pathlib, sys, sysconfig
          import purba

          package = pathlib.Path(purba.__file__)
          extension = pathlib.Path(importlib.import_module('purba.purba').__file__)

          print('interpreter    :', sys.version.split()[0])
          print('EXT_SUFFIX     :', sysconfig.get_config_var('EXT_SUFFIX'))
          print('package file   :', package)
          print('extension file :', extension)

          assert package.name == '__init__.py', f'maturin no longer writes a package wrapper: {package}'
          assert extension.suffix in {'.so', '.pyd', '.dylib'}, f'the submodule is not the extension: {extension}'
          print('the extension loads, and does not only link')
          "

  # ---------------------------------------------------------------- PROBE E
  # The free-threaded arm was decided by reading `pyo3-build-config` source. It
  # has never been run. Probe A showed mise can supply the interpreter, but that
  # no lockfile can record it, so this probe measures BOTH sources.
  #
  # ⚠️ The first version of this probe measured nothing and reported success.
  # Two faults, both worth stating because each is easy to repeat:
  #   1. mise-action ran AFTER setup-python and won the PATH, so the arm that
  #      asked for a free-threaded interpreter built against mise's 3.12.
  #   2. The reporting step called bare `python` rather than going through mise,
  #      so on the other arm it read the runner's own 3.12.3.
  # Every step carried continue-on-error, so both faults were invisible.
  #
  # This version asserts the interpreter is free-threaded BEFORE it builds. A
  # probe that cannot refuse measures nothing.
  e-freethreaded:
    name: E free-threaded via ${{ matrix.source }}
    strategy:
      fail-fast: false
      matrix:
        source: [mise-flavor, setup-python]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # mise supplies the Rust toolchain and maturin on both arms. It runs FIRST
      # so that setup-python can win the PATH on the arm that uses it.
      - uses: jdx/mise-action@v4

      - uses: actions/setup-python@v5
        if: matrix.source == 'setup-python'
        with:
          python-version: '3.14t'

      # The lockfile names one interpreter and cannot record a flavor, so this
      # step relaxes `locked`. That relaxation IS the finding: the free-threaded
      # arm cannot come from the locked substrate.
      - name: Ask mise for a free-threaded interpreter
        id: mise-interp
        if: matrix.source == 'mise-flavor'
        continue-on-error: true
        env:
          MISE_PYTHON_COMPILE: '0'
          MISE_PYTHON_PRECOMPILED_FLAVOR: freethreaded-install_only_stripped
          MISE_TOOL_CONFIG_LOCKED: 'false'
        run: |
          set -euo pipefail
          mise install python@3.14
          path=$(mise x python@3.14 -- python -c 'import sys; print(sys.executable)')
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "mise resolved $path"

      - name: Name the interpreter under test
        id: interp
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.source }}' = 'mise-flavor' ]; then
            path='${{ steps.mise-interp.outputs.path }}'
            if [ -z "$path" ]; then
              echo "::error::mise did not supply a free-threaded interpreter, so this arm cannot build."
              exit 1
            fi
          else
            path=$(command -v python)
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "the interpreter under test is $path"

      # No continue-on-error. A GIL interpreter here means the arm measured the
      # wrong thing, and the probe must say so rather than build anyway.
      - name: Refuse unless the interpreter is free-threaded
        shell: bash
        env:
          INTERP: ${{ steps.interp.outputs.path }}
        run: |
          set -euo pipefail
          "$INTERP" -c "
          import sys, sysconfig
          print('executable     :', sys.executable)
          print('version        :', sys.version.split()[0])
          print('Py_GIL_DISABLED:', sysconfig.get_config_var('Py_GIL_DISABLED'))
          print('abiflags       :', repr(sysconfig.get_config_var('abiflags')))
          print('EXT_SUFFIX     :', sysconfig.get_config_var('EXT_SUFFIX'))
          assert sysconfig.get_config_var('Py_GIL_DISABLED'), 'this interpreter has the GIL, so the arm measured the wrong thing'
          assert sys.version_info[:2] >= (3, 14), 'this arm needs 3.14 or later'
          print('the interpreter is free-threaded')
          "

      - name: Build against it, and read the wheel tag
        shell: bash
        env:
          INTERP: ${{ steps.interp.outputs.path }}
        run: |
          set -euo pipefail
          rm -rf target/wheels
          mise x -- maturin build --interpreter "$INTERP"
          ls -l target/wheels/
          for wheel in target/wheels/*.whl; do
            name=$(basename "$wheel")
            echo "wheel: $name"
            case "$name" in
              *abi3*)
                echo "::warning::The wheel is tagged abi3. pyo3 did NOT drop the stable ABI on a free-threaded interpreter."
                ;;
              *)
                echo "The wheel is version-specific, so pyo3 dropped abi3 as predicted."
                ;;
            esac
          done

  # ---------------------------------------------------------------- PROBE F
  # Decision 9 says the rollup reads `needs.*.result`, because a skipped arm
  # otherwise reads as success. That was reasoned, never measured.
  #
  # ⚠️ actionlint refuses the first shape this probe was written in. A job-level
  # `if` cannot read `matrix`: the allowed contexts are github, inputs, needs and
  # vars. So a matrix arm cannot be skipped that way, and the hazard the rollup was
  # designed against cannot arise from an `if` at all.
  #
  # The hazard that CAN arise is `continue-on-error`. F1 measures it. F2 measures
  # the skipped case using a whole job, which is the only way to reach it.

  # F1 — arm 2 fails. It carries continue-on-error, so the arm is tolerated.
  # The question is what the MATRIX reports to a rollup.
  f1-matrix:
    name: F1 arm ${{ matrix.n }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { n: 1, tolerate: false, fails: false }
          - { n: 2, tolerate: true, fails: true }
          - { n: 3, tolerate: false, fails: false }
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ matrix.tolerate }}
    steps:
      - name: Fail on purpose, on arm 2 only
        shell: bash
        run: |
          if [ "${{ matrix.fails }}" = "true" ]; then
            echo "arm ${{ matrix.n }} fails, and the job tolerates it"
            exit 1
          fi
          echo "arm ${{ matrix.n }} did its work"

  f1-rollup:
    name: F1 rollup that reads the result
    needs: f1-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print the whole needs context, so nothing is inferred
        run: |
          echo 'needs.f1-matrix.result = ${{ needs.f1-matrix.result }}'
          cat <<'JSON'
          ${{ toJSON(needs) }}
          JSON
      - name: Say what this proves
        shell: bash
        run: |
          result='${{ needs.f1-matrix.result }}'
          if [ "$result" = "success" ]; then
            echo "::warning::A tolerated arm failed and the matrix still reports success. A rollup that reads needs.*.result does NOT catch it."
          else
            echo "the matrix reported $result, so the result does carry the tolerated failure"
          fi

  # F2 — a whole job is skipped. The naive rollup lists it in `needs` and does
  # nothing else. The strict rollup reads the result.
  f2-skipped:
    name: F2 the job that is skipped
    # Always false here: this workflow triggers on push and
    # workflow_dispatch only. actionlint refuses a constant `false`.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "this never runs"

  f2-rollup-naive:
    name: F2 rollup that trusts needs alone
    needs: f2-skipped
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "This job ran, so a naive rollup reported success over a skipped job."

  f2-rollup-strict:
    name: F2 rollup that reads the result
    needs: f2-skipped
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print the whole needs context
        run: |
          echo 'needs.f2-skipped.result = ${{ needs.f2-skipped.result }}'
          cat <<'JSON'
          ${{ toJSON(needs) }}
          JSON
      - name: Refuse unless the job succeeded
        shell: bash
        run: |
          result='${{ needs.f2-skipped.result }}'
          if [ "$result" != "success" ]; then
            echo "::error::the job reported $result, so this rollup refuses"
            exit 1
          fi
          echo "the job reported success"
