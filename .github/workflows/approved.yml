# On a review, this workflow starts the job that accepts a branch.
#
#   the job:       .github/workflows/sign.yml
#
# On a review, GitHub runs the workflows of the pull request. When this
# workflow run finishes, GitHub starts `sign.yml` from `main`, and its `sign`
# job reads the approval and the gates itself. So a workflow of this name on
# any branch can start the `sign` job, and cannot change what that job reads.
#
# `sign.yml` names this workflow, so a rename stops a review from starting the
# `sign` job.
name: Approved

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  approved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "A reviewer submitted a review, and the sign job from main reads it."
