# The build of each cargo script, cached on main for every pull request.
#
#   the decision:  docs/decisions/a-script-that-needs-a-rust-library-is-a-cargo-script.md
#   the tasks:     .config/tasks.toml, under `lint:records`, `lint:cargo-scripts`
#                  and `test:cargo-scripts`
#
# A pull request restores a cache that its base branch saved, and never one
# that another pull request saved.
# https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
name: Cargo scripts

on:
  push:
    branches: [main]
    paths:
      - "scripts/**.rs"
      - "scripts/**/Cargo.lock"
      - ".github/**.rs"
      - ".github/**/Cargo.lock"
      - ".config/mise.toml"
      # A change of this file runs the job. The job saves a cache only under a key
      # that no cache holds yet.
      - ".github/workflows/cargo-scripts.yml"

permissions:
  contents: read

concurrency:
  group: cargo-scripts
  cancel-in-progress: true

env:
  MISE_VERSION: 2026.9.14

jobs:
  # One cache for each OS, because a cargo script runs only on the OS that built
  # it.
  cache:
    name: Cache ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ env.MISE_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/scripts
          key: "cargo-scripts-${{ runner.os }}-\
            ${{ hashFiles('scripts/**/Cargo.lock', '.github/**/Cargo.lock', '.config/mise.toml') }}"

      # `lint:records` builds each script to run it, `lint:cargo-scripts` checks each
      # one and `test:cargo-scripts` tests each one, so the cache holds what the
      # jobs read.
      - name: Build each cargo script, check it and test it
        run: |
          mise run lint:records
          mise run lint:cargo-scripts
          mise run test:cargo-scripts
