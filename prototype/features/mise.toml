[vars]
crate = "purba"
profile = "dev"

[env]
PURBA_ENV = "from-mise"
_.file = ".env"

[tasks.py]
description = "Python recipe"
run = """
#!/usr/bin/env python
import sys, os
print("python", sys.version.split()[0], "PURBA_ENV=", os.environ.get("PURBA_ENV"))
"""

[tasks.vars]
run = 'echo "crate={{vars.crate}} profile={{vars.profile}} target={{arch()}} wheel={{vars.crate}}-{{vars.profile}}"'

[tasks.cond]
run = '''echo "{% if vars.profile == "dev" %}debug build{% else %}release build{% endif %}"'''

[tasks.plat]
run = 'echo "{{os()}} recipe"'

[tasks.inner]
usage = 'arg "<arg>"'
run = 'echo "inner got $usage_arg"'

[tasks.outer]
depends = ["inner from-outer"]
run = 'echo "outer done"'

[tasks.many]
usage = 'arg "<args>" var=#true'
run = 'echo "many: $usage_args"'

[tasks.hidden]
hide = true
run = 'echo hidden'

[tasks.rich]
usage = '''
flag "--verbose" help="chatty"
flag "--jobs <n>" help="how many"
arg "<name>" help="required"
'''
run = 'echo "name=$usage_name verbose=$usage_verbose jobs=$usage_jobs"'

[tasks.pinned]
tools = { python = "3.11" }
run = 'python -V'

[tasks.dotenv]
run = 'echo "mise sees $FROM_DOTENV"'

[tasks.s1]
run = "echo one; sleep 1; echo one-done"
[tasks.s2]
run = "echo two"
[tasks.seq]
run = ["echo A", "sleep 1", "echo B"]
[tasks.selfref]
run = "command -v mise && mise --version"

[tasks.g1]
run = "echo GATE-1"
[tasks.g2]
run = "echo GATE-2"
[tasks.allgates]
depends = ["g1", "g2"]
[tasks.cleanup]
run = "echo CLEANED"
[tasks.pf]
description = "clean, then every gate"
depends = ["cleanup"]
depends_post = ["allgates"]
