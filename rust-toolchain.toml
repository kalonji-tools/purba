# The one place that names the Rust toolchain.
# Format: https://rust-lang.github.io/rustup/overrides.html
#
# Removing `rust-src` fails silently. devenv aims RUST_SRC_PATH at this
# toolchain whether or not the component is present, so dropping it leaves the
# variable pointing at a directory that does not exist, with no error and no
# warning, and rust-analyzer stops resolving the standard library.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["clippy", "rustfmt", "rust-analyzer", "rust-src"]
